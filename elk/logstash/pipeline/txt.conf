input {
  file {
    path => "/data/uploads/txt/*.txt"
    mode => "read"
    file_completed_action => "delete"
    sincedb_path => "/dev/null"
    start_position => "beginning"
    tags => ["txt"]
  }
}

filter {
  ruby {
    code => "p = event.get('[log][file][path]'); event.set('uploaded_file', File.basename(p)) if p"
  }
  grok {
    match => { "message" => "^%{TIMESTAMP_ISO8601:timestamp} %{WORD:level} %{NOTSPACE:service} %{NOTSPACE:event_type} %{IP:src_ip} %{NOTSPACE:username} %{GREEDYDATA:message}$" }
    overwrite => ["message"]
    tag_on_failure => ["_grokparsefailure"]
  }
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure"]
  }
  mutate {
    uppercase => ["level"]
    remove_field => ["timestamp", "host", "log", "event"]
    add_field => { "source_type" => "txt" }
  }
  if [src_ip] and [src_ip] != "" {
    geoip {
      source => "src_ip"
      target => "geo"
      ecs_compatibility => disabled
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }
}

output {
  if "_grokparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-security-errors"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-security-%{+YYYY.MM.dd}"
    }
  }
}

