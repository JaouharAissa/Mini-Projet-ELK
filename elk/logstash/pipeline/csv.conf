input {
  file {
    path => "/data/uploads/csv/*.csv"
    mode => "read"
    file_completed_action => "delete"
    sincedb_path => "/dev/null"
    start_position => "beginning"
    tags => ["csv"]
  }
}

filter {
  ruby {
    code => "p = event.get('[log][file][path]'); event.set('uploaded_file', File.basename(p)) if p"
  }
  csv {
    separator => ","
    skip_header => true
    columns => ["timestamp","level","service","event_type","src_ip","username","message"]
  }
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure"]
  }
  mutate {
    uppercase => ["level"]
    remove_field => ["timestamp", "host", "log", "event"]
    add_field => { "source_type" => "csv" }
  }
  if [src_ip] and [src_ip] != "" {
    geoip {
      source => "src_ip"
      target => "geo"
      ecs_compatibility => disabled
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }
}

output {
  if "_csvparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-security-errors"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-security-%{+YYYY.MM.dd}"
    }
  }
}
