input {
  file {
    path => "/data/uploads/json/*.json"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/json_completed.log"
    sincedb_path => "/dev/null"
    codec => "json"
    tags => ["json"]
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure"]
  }
  mutate {
    uppercase => ["level"]
    remove_field => ["timestamp", "host", "log", "event"]
    add_field => { "source_type" => "json" }
  }
  if [src_ip] and [src_ip] != "" {
    geoip {
      source => "src_ip"
      target => "geo"
      ecs_compatibility => disabled
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }
}

output {
  if "_dateparsefailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-security-errors"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-security-%{+YYYY.MM.dd}"
    }
  }
}
